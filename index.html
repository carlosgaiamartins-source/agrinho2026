<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrinho 2026 - Minijogo do Agricultor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Agrinho 2026</h1>
        <p>Aprenda a melhorar a produção da sua fazenda de forma divertida!</p>
    </header>

    <main>
        <section class="game-section">
            <h2>Minijogo: Aumente sua produção!</h2>
            <div class="game-container">
                <p>Produção atual: <span id="production">0</span> unidades</p>
                <button id="plantButton">🌱 Plantar / Fertilizar</button>
                <p id="message">Clique no botão para melhorar sua produção!</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Projeto Agrinho 2026 - Educação e Tecnologia na Agricultura</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
